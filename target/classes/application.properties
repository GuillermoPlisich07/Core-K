# ── Servidor ──────────────────────────────────────────────────────────────────
spring.application.name=ventas-ia
server.port=${SPRING_PORT:8080}

# ── Base de datos ──────────────────────────────────────────────────────────────
# Docker Compose pasa: DB_URL=jdbc:postgresql://postgres:5432/ventas_ia
# Dev local usa el fallback con localhost
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ventas_ia}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JSON ───────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── OpenAPI / Swagger ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.ventasia=INFO
logging.level.org.hibernate.SQL=WARN
