# ── Servidor ──────────────────────────────────────────────────────────────────
spring.application.name=konverza
server.port=${SPRING_PORT:8080}

# ── Base de datos ──────────────────────────────────────────────────────────────
# Docker Compose pasa: DB_URL=jdbc:postgresql://postgres:5432/konverza
# Dev local usa el fallback con localhost
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/konverza}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JSON ───────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── OpenAPI / Swagger ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── JWT / Auth ─────────────────────────────────────────────────────────────────
# JWT_SECRET DEBE configurarse via variable de entorno en cualquier ambiente
# compartido o de produccion (ver JwtService: sin ella se usa una clave insegura
# de desarrollo y se loguea un warning).
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Cookie del refresh token: Secure=true por defecto (requiere HTTPS). Para dev
# local sobre HTTP, setear COOKIE_SECURE=false.
app.cookie-secure=${COOKIE_SECURE:true}

# ── Seed de usuarios demo ────────────────────────────────────────────────────
# Deshabilitar en produccion con SEED_DEMO_USERS=false (ver DataSeeder)

# ── Auth de servicio (Core-k <-> AI-Service-k) ─────────────────────────────────
# Sin valor por defecto a proposito: si falta cualquiera de estas tres, el
# contexto de Spring falla al arrancar (ver ServiceTokenService,
# ServiceKeyAuthenticationFilter, WebClientConfig). Deben coincidir con las
# mismas variables configuradas en AI-Service-k.
service.jwt.secret=${SERVICE_JWT_SECRET}
service.jwt.delegated-token-expiration-ms=${SERVICE_JWT_DELEGATED_EXPIRATION_MS:600000}
service.ai-service-api-key=${AI_SERVICE_API_KEY}
service.core-k-api-key=${CORE_K_API_KEY}

# ── Actuator (health check para Docker/infra) ──────────────────────────────────
# Solo se expone /actuator/health (permitido sin auth en SecurityConfig).
# show-details se deja en su default ("never") para no filtrar info de la DB.
management.endpoints.web.exposure.include=health

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.konverza=INFO
logging.level.org.hibernate.SQL=WARN
